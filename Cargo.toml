[package]
name = "surrealdb-explorer"
version = "0.1.0"
edition = "2024"

[dependencies]
canton-analytics-reader = { path = "analytics/reader" }
iced_plot = "0.5"
iced_table2 = "0.14"
plotters = { version = "0.3", default-features = false }
plotters-iced2 = "0.14"
iced = { version = "0.14", features = ["canvas", "tokio"] }
csv = "1.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
surrealdb = { version = "4.0.0", features = ["kv-surrealkv"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
toml = "1.2.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
rmcp = { version = "3.9", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8.9"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }

# The graph layout and drawing run every frame: build them (and the
# dependencies that draw) with optimisation even in development builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
