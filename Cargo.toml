[package]
name = "surrealdb-explorer"
version = "0.1.0"
edition = "2024"
description = "Desktop graph explorer for SurrealDB, with a Canton event graph view and an MCP server for Claude Code"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gyorgybalazsi/surrealdb-explorer"

[dependencies]
# The analytics dashboard (the `dashboard` feature).
canton-analytics-reader = { path = "analytics/reader", optional = true }
iced_plot = { version = "0.5", optional = true }
iced_table2 = { version = "0.14", optional = true }
plotters = { version = "0.3", default-features = false, optional = true }
plotters-iced2 = { version = "0.14", optional = true }
iced = { version = "0.14", features = ["canvas", "tokio"] }
csv = "1.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
surrealdb = "4.0.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
toml = "1.2.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
rmcp = { version = "3.9", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8.9"
png = "0.18"

[features]
default = ["dashboard"]
# The Dashboard over analytics tables. It pulls in Polars, which is slow to
# build: `--no-default-features` builds the explorer without it.
dashboard = ["dep:canton-analytics-reader", "dep:iced_plot", "dep:iced_table2", "dep:plotters", "dep:plotters-iced2"]

# The Dock icon on macOS: a window icon does nothing there, so the app sets
# its icon image directly (the same objc2 versions winit already uses).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }

# `cargo bundle` (https://github.com/burtonageo/cargo-bundle) builds a macOS
# .app (or .deb / .msi) with this icon.
[package.metadata.bundle]
name = "SurrealDB Explorer"
identifier = "io.github.gyorgybalazsi.surrealdb-explorer"
icon = [
    "assets/icon/icon-16.png",
    "assets/icon/icon-32.png",
    "assets/icon/icon-64.png",
    "assets/icon/icon-128.png",
    "assets/icon/icon-256.png",
    "assets/icon/icon-512.png",
    "assets/icon/icon-1024.png",
]

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
tempfile = "3"
# Drives the window in tests (tests/integration/ui.rs). Keep in step with iced.
iced_test = "0.14"

# The graph layout and drawing run every frame: build them (and the
# dependencies that draw) with optimisation even in development builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
