[package]
name = "surrealdb-explore"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
iced = { version = "0.14", features = ["canvas"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
surrealdb = { version = "4.0.0", features = ["kv-surrealkv"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[features]
# The native iced GUI (`cargo run --features gui --bin graph-gui`).
gui = ["dep:iced"]

[[bin]]
name = "graph-gui"
path = "src/bin/graph_gui/main.rs"
required-features = ["gui"]
