[package]
name = "canton-analytics"
version = "0.1.0"
edition = "2024"
description = "Runs WASM analytics plugins over a SurrealDB database and appends their output to Delta Lake tables"

[dependencies]
anyhow = "1"
futures-util = "0.3"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
deltalake = "1.1"
polars = { version = "0.55", features = ["lazy", "parquet", "timezones"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
surrealdb = "4.0.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wasmtime = "50"
wasmtime-wasi = "50"

[dev-dependencies]
surrealdb = { version = "4.0.0", features = ["kv-mem"] }
