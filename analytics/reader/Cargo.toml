[package]
name = "canton-analytics-reader"
version = "0.1.0"
edition = "2024"
description = "Reads the Delta Lake tables written by canton-analytics plugins, with Polars"

[lib]
name = "analytics_reader"

[dependencies]
anyhow = "1"
deltalake = "1.1"
polars = { version = "0.55", features = ["lazy", "parquet", "timezones"] }
tokio = { version = "1", features = ["rt"] }
