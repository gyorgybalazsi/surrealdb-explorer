[package]
name = "contract-lifetimes"
version = "0.1.0"
edition = "2024"
description = "Analytics plugin: how long each Canton contract lived, from its create to its archive"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
arrow-array = { version = "59", default-features = false }
arrow-ipc = { version = "59", default-features = false }
arrow-schema = { version = "59", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "0.63"

[profile.release]
opt-level = "s"
lto = true
strip = true
